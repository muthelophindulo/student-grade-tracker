<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${student.name} + ' Details'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <a th:href="@{/}" class="btn btn-secondary mb-3">← Back to All Students</a>
        
        <div class="card">
            <div class="card-header">
                <h2 th:text="${student.name}"></h2>
            </div>
            <div class="card-body">
                <p><strong>Student ID:</strong> <span th:text="${student.studentId}"></span></p>
                <p><strong>Major:</strong> <span th:text="${student.major}"></span></p>
                <p><strong>GPA:</strong> <span th:text="${#numbers.formatDecimal(student.gpa, 1, 2)}"></span></p>
                <p>
                    <span th:if="${student.honorRoll}" class="badge bg-success">Honor Roll</span>
                    <span th:if="${student.atRisk}" class="badge bg-danger">At Risk</span>
                    <span th:if="${student.improving}" class="badge bg-success">Improving</span>
                </p>
                
                <h4 class="mt-4">Grades</h4>
                <table class="table table-sm">
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Semester</th>
                            <th>Score</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="grade : ${student.grades}">
                            <td th:text="${grade.courseName}"></td>
                            <td th:text="${grade.semester}"></td>
                            <td th:text="${grade.score}"></td>
                            <td th:text="${grade.letterGrade}"></td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Add Grade Form -->
                <h5 class="mt-4">Add New Grade</h5>
                <form th:action="@{/students/{id}/grades-web(id=${student.id})}" method="post" class="row g-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" name="courseName" placeholder="Course Name" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" class="form-control" name="semester" placeholder="Semester" min="1" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" class="form-control" name="score" placeholder="Score" min="0" max="100" step="0.1" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary">Add Grade</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
