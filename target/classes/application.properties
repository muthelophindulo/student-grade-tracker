# Server Configuration
server.port=8081

# Application Information
spring.application.name=student-grade-tracker
app.description=Track how students are improving
app.version=1.0.0

# Package Information
app.package=com.phindulo_dev.student-grade-tracker
app.group=com.phindulo_dev
app.artifact=student-grade-tracker

# Java Version (based on your selection)
app.java.version=25

# Logging Configuration
logging.level.com.phindulo_dev=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Spring Boot Specific Settings
spring.main.banner-mode=console
spring.main.log-startup-info=true

# Web Settings
server.servlet.context-path=/

# Thymeleaf Configuration (if you add HTML templates)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Date Format for JSON responses
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Welcome message (MOVED TO SEPARATE LINE - FIXED THE ERROR)
app.welcome=Student Grade Tracker API is running!